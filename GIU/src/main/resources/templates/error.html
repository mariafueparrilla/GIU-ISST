<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>urFIX - Error</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .font-mono-brand { font-family: 'Space Mono', monospace; }
    html, body { height: 100%; margin: 0; }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              100: '#d9edff',
              500: '#2b8aff',
              600: '#1468f5'
            },
            surface: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0'
            }
          }
        }
      }
    };
  </script>
</head>
<body class="h-full bg-surface-50 text-slate-800">
  <main class="min-h-full flex items-center justify-center p-6"
        style="background: radial-gradient(circle at 20% 20%, #d9edff 0%, #f8fafc 45%, #f1f5f9 100%);">
    <section class="w-full max-w-xl bg-white border border-slate-200 rounded-3xl shadow-xl p-8">
      <div class="mb-5">
        <p class="text-xs font-semibold tracking-widest uppercase text-brand-600">urFIX</p>
        <h1 class="font-mono-brand text-3xl font-bold text-slate-900 mt-2">Ha ocurrido un error</h1>
      </div>

      <div class="rounded-2xl border border-slate-200 bg-surface-50 p-4 mb-6">
        <p class="text-sm text-slate-500">Código</p>
        <p class="text-2xl font-bold text-slate-900" th:text="${status} ?: 'Error'">Error</p>

        <p class="text-sm text-slate-500 mt-3">Detalle</p>
        <p class="text-base text-slate-700" th:text="${error} ?: 'Se ha producido un error inesperado.'">Se ha producido un error inesperado.</p>

        <p class="text-xs text-slate-400 mt-3" th:if="${path != null}">
          Ruta: <span th:text="${path}">/</span>
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <a href="/login"
           class="flex-1 inline-flex items-center justify-center px-4 py-3 rounded-xl text-white font-semibold hover:opacity-90 transition"
           style="background:#1468f5;">
          Ir al login
        </a>

        <button type="button"
                onclick="window.history.back()"
                class="flex-1 px-4 py-3 rounded-xl border border-slate-300 text-slate-700 font-semibold hover:bg-slate-100 transition">
          Volver atrás 
        </button>
      </div>
    </section>
  </main>
</body>
</html>
